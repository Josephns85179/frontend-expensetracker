<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Expense Tracker by 535250135</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h2>Expense Tracker by 535250135</h2>

            <div id="expenseTable" class="expenseTable"></div>

            <form id="formInput" class="chat-form">
                <input type="text" id="namaExpense" placeholder="Keterangan pengeluaran" required>
                <input type="number" id="nominalExpense" placeholder="Nominal pengeluaran (Rp.)" min="1" required>
                <button type="submit">Tambahkan</button>
            </form>

            <h4>Total data pengeluaran:</h4>
            <p id="jumlahDataPengeluaran">0</p>
            <h4>Total nominal semua pengeluaran (Rp):</h4>
            <p id="totalNominalPengeluaran">0</p>

            <h2>Tabel Pengeluaran</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nomor</th>
                        <th>Keterangan</th>
                        <th>Nominal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelExpense"></tbody>
            </table>
        </div>
        <script src="app.js"></script>
    </body>
</html>
