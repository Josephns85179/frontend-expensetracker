<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Expense Tracker by 535250135</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Expense Tracker by 535250135</h1>

            <form id="formInput" class="input-form">
                <input type="text" id="namaExpense" placeholder="Keterangan pengeluaran" required>
                <input type="number" id="nominalExpense" placeholder="Nominal pengeluaran (Rp.)" min="1" required>
                <button type="submit">Tambahkan</button>
            </form>
            <div class="summary-container">
                <div class="summary-card">
                    <h3>Jumlah data pengeluaran:</h3>
                    <h4 id="jumlahDataPengeluaran">0</h4>
                </div>
                <div class="summary-card">
                    <h3>Total nominal semua pengeluaran:</h3>
                    <h4>Rp. <span id="totalNominalPengeluaran">0</span></h4>
                </div>
            </div>

            <h2>Tabel Pengeluaran</h2>
            <div class="table-container">
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">No.</th>
                            <th style="width: 350px;">Keterangan</th>
                            <th style="width: 350px;">Nominal</th>
                            <th style="width: 30px; text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelExpense"></tbody>
                </table>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
