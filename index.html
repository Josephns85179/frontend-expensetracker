<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Expense Tracker by 535250135</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h2>Expense Tracker by 535250135</h2>

            <div id="expenseTable" class="expenseTable"></div>

            <form id="inputForm" class="chat-form">
                <input type="text" id="username" placeholder="Keterangan pengeluaran">
                <input type="number" id="message" placeholder="Nominal">
                <button type="submit">Send</button>
            </form>

            <div id="errors" class="errors"></div>

            <!--Controls-->
            <div class="controls">
                <button id="themeToggle">Toggle Theme</button>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
